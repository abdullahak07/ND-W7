<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f7fb"><title>COMP6012 Week 7 · Cyber Threat War Room</title>
<style>
html,body{height:100%;margin:0}body{display:grid;place-items:center;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 10% 0,#eef3ff,transparent 34%),linear-gradient(135deg,#fbfdff,#edf4f8);color:#173149}.load{text-align:center;padding:34px}.orb{width:54px;height:54px;border:4px solid #dce6ef;border-top-color:#3157d5;border-right-color:#2baa7b;border-radius:50%;margin:0 auto 18px;animation:s .8s linear infinite}.bar{width:min(370px,76vw);height:7px;background:#dfe8ef;border-radius:99px;overflow:hidden;margin:18px auto}.bar i{display:block;height:100%;width:38%;background:linear-gradient(90deg,#3157d5,#1b91ba,#2baa7b);animation:b 1.25s ease-in-out infinite}.small{color:#667c8e;font-size:.88rem}@keyframes s{to{transform:rotate(360deg)}}@keyframes b{0%{transform:translateX(-130%)}100%{transform:translateX(300%)}}</style>
</head>
<body><div class="load"><div class="orb"></div><strong>Opening Cyber Threat War Room</strong><div class="bar"><i></i></div><div class="small">Assets · adversaries · attack paths · SIEM · UBA</div></div>
<script type="module">
import p1 from './site1.txt?raw';import p2 from './site2.txt?raw';import p3 from './site3.txt?raw';import p4 from './site4.txt?raw';import p5 from './site5.txt?raw';
(async()=>{try{if('scrollRestoration' in history)history.scrollRestoration='manual';if(typeof DecompressionStream==='undefined')throw new Error('Please use an up-to-date browser.');const encoded=(p1+p2+p3+p4+p5).replace(/\s+/g,'');const bin=atob(encoded),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();if(!html.includes('Cyber Threat War Room')||!html.includes('Intelligence Studio theme override')||!html.includes('Live SOC simulation'))throw new Error('Website package validation failed.');document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="load"><strong>Website could not load.</strong><p class="small">'+e.message+'</p></div>'}})();
</script></body></html>
